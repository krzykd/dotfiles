# style = "bold fg:green"

[custom.os]
description = "os"
command = """
case $OS_ID in

  alpine)
    echo " "
    ;;
  arch)
    echo " "
    ;;
  debian)
    echo " "
    ;;
  ubuntu)
    echo " "
    ;;
  fedora)
	case $OS_VARIANT_ID in
		coreos)
			echo " "
			;;
		*)
			echo " "
			;;
	esac
	;;
  nixos)
    echo " "
    ;;
  *)
    echo -n " "
    ;;
esac
"""
when = "true"
# format = "[$output]($style) "
format = "$output "
shell = ["dash"]

[custom.ssh_keys]
description = "SSH keys"
command = """
count=0
IFS="
"
SSH_KEYS=$(ssh-add -l)

for key in $SSH_KEYS; do
  count=$((count + 1))
done

if [ $(echo "$SSH_KEYS" | grep -c 'no identities') -eq 1 ]; then
	echo '🔑🚫'
else
  echo "$count🔑"
fi
"""
when = "true"
format = "$symbol[$output]($style) "
shell = ["dash"]

[directory]
format = "[ $path ](bold green)[$read_only]($read_only_style)"
truncation_length = 3
fish_style_pwd_dir_length = 3
truncate_to_repo = false
read_only = ' '

# BUG: The directory substitution doesn't work well with fish_style_pwd_dir_length 2060
# https://github.com/starship/starship/issues/2060
# [directory.substitutions]
# "Documents" = "󰈙 "
# "Downloads" = " "
# "Music" = " "
# "Pictures" = " "

[direnv]
disabled = false
symbol = " "
format = '[$symbol$allowed]($style) '
# loaded_msg = ""
allowed_msg = ""
not_allowed_msg = "/🔴"
denied_msg = "/🔴"

# 🌐 via http://squid.lan:3128
[env_var.HTTP_PROXY]
symbol = '🦑'
format = '$symbol '
[env_var.http_proxy]
symbol = '🦑'
format = '$symbol '

[fill]
style = 'fg:fill'
symbol = ' '
# symbol = "\u2500" # "\u2500" "─" # no line: ' '

[git_branch]
format = "[\u3009$symbol $branch(:$remote_branch)]($style)[ ]()" # \u3009 \uf460 ❯
style = 'fg:orangegit'
symbol = "" # 
# ignore_branches = ['master', 'main']

[git_commit]
format = '[\($hash$tag\)]($style)[ ]()'
style = 'fg:orangegit'
commit_hash_length = 8
tag_symbol = " \uf412 " # \uf412 '  ' # '  ''
tag_disabled = false
disabled = false

[git_metrics]
format = '([+$added]($added_style)|[-$deleted]($deleted_style) )'
disabled = false

[git_status]
format = '([$all_status$ahead_behind]($style))'
style = 'fg:orangegit'
conflicted = "[\ueaaf${count} ](fg:conflicted)" # 
ahead = "[\u21E1${count} ](fg:ahead)" # ⇡ \ueaa0
behind = "[\u21E3${unt} ](fg:behind)" # ⇣ \uea9d
diverged = "[\u2195\u21E1${ahead_count} \u21E3${behind_count} ](fg:diverged)" # \u2195\u21E1 ⇕ ↕ ⇳ 󰹹 󰹺 󰧈
up_to_date = "[\u2714 ](fg:uptodate)" # \u2714 ✔ \u2713 \ueab2 ✓
untracked = "[ ${count} ](fg:untracked)" # 󰟉 \uf441 \ueb32 ﳇ ' ' # '? '
stashed = "[\ueb29 ${count} ](fg:stashed)" # \ueb29  '📦 '# ' ' # ' ' # ' ' # ' '
modified = "[\uf040 ${count} ](fg:modified)" # \uf040 󰷉 '📝' # '! ' #  #  #  \uf044 \uea73
staged = "[\u26DF .${count} ](fg:staged)" # \u26DF  '+ '
renamed = "[\u0373 ${count} ](fg:renamed)" # \u0373 \ueb69  ' ' # '﫦' # ᴂ #  #  #  # ﳳ
deleted = "[\uea81 ${count} ](fg:deleted)" # \uea81 \uf507 ﯊ '🗑 ' '- '
disabled = false

[golang]
symbol = "󰟓 "
style = 'fg:golang'
format = '[ $symbol ($version) ]($style)'

[helm]
format = 'via [$symbol($version )]($style)'
symbol = '⎈ '

[jobs]
format = "[ \ueab5 ](fg:jobs bold)[$symbol $number]($style)" # \u3009
style = 'fg:jobs'
symbol = "󰜎" # \ueb7b  \uef0c 省 # '廒' # '󰜎' # ''
symbol_threshold = 1
number_threshold = 2
disabled = false

[kubernetes]
# symbol = '☸ '
symbol = '󱃾 '
disabled = false
format = '[$symbol$context( \($namespace\))]($style) '

[mise]
disabled = false
# style = 'fg:mise'
symbol = "🙾 "
format = 'on [$symbol]($style) '
# Disable health checking, nags about mise version upgrade with exit code 1
# healthy_symbol = '+'
# unhealthy_symbol = '󱕼 '
# format = 'on [$symbol$health]($style) '

# [os]
# disabled = false
#
# [os.symbols]
# Alpine = " "
# Arch = " "
# CentOS = " "
# Debian = " "
# Fedora = " "
# FreeBSD = " "
# NixOS = " "
# Raspbian = " "
# Redhat = " "
# Ubuntu = " "
# Unknown = " "
# Windows = " "

[python]
symbol = ' '
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
# pyenv_version_name = true

[shell]
format = '[$indicator]($style)()'
# style = 'fg:shell'
# empty indicator (''): e.g. if you do not want to see indicator for your standard shell
zsh_indicator = '󰰶 ' # '%_ ' '󰰶 '
bash_indicator = ' ' # "\uebca " ' ' '\$_ '
fish_indicator = '󰈺 ' # "\uee41 " '󰈺 ' '>>_ '
powershell_indicator = ' ' # "\uebc7 " ' ' '>_'
unknown_indicator = '?_ ' # '?_ ' ' '
disabled = false # set to false if you want to see the shell indicator

[status]
format = "[$symbol $status]($style)" # \uf0a2  , \ueaa2
style = 'fg:status'
symbol = " \u2717" # \u2717 \uf467 \uebde  ✘
disabled = false

[sudo]
format = "[\ueab6 ](fg:sudo bold)[ $symbol]($style)" # \u276F ❯ \ueab6 
style = 'fg:red bold'
symbol = "\uf007! " # \uf007  # \uf21b \uedcc ' ' # ' '
disabled = false

[terraform]
# format = '[ $version/$workspace]($style) '
format = '[ $workspace]($style) '

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
format = '[ $time ]($style)'

[username]
show_always = false
# style_user = "bg:#9A348E"
# style_root = "bg:#9A348E"
format = '[ $user]($style)'
disabled = false

[hostname]
ssh_only = true
ssh_symbol = '@'
style = 'bold dimmed green'
format = '[$ssh_symbol](bold blue)[$hostname](bold red) '
trim_at = '.'
disabled = false

# Redraws only part of the prompt
# Used in ~/.config/fish/conf.d/opt/starship.fish
[profiles]
right_transient = "$status$cmd_duration$time"
