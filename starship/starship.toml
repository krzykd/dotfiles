"$schema" = 'https://starship.rs/config-schema.json'

#Logs: ~/.cache/starship/session_${STARSHIP_SESSION_KEY}.log

# Customizing the prompt (and placing desired modules at desired position and sequence):
# ╭╴ # \u256D\u2574
# ╰╴ # \u2570\u2574
format = """
[╭╴](fg:greydimmed)\
${custom.os}\
$username\
$hostname\
$directory\
$env_var\
$direnv\
$mise\
$kubernetes\
$helm\
$terraform\
$golang\
$php\
$python\
$container\
$git_branch$git_commit$git_state$git_metrics$git_status\
$jobs\
$fill\
\
${custom.ssh_keys}\
$shell\
$status\
$cmd_duration\
$time\
$line_break\
\
[╰╴](fg:greydimmed)\
[$character]($style)"""

# move the rest of the prompt to the right
right_format = """
($style)"""

# Disable the blank line at the start of the prompt
add_newline = false

# Color Palette
palette = "Power10"

[palettes.Power10]
# only lowercase names
greydimmed = '#424242'
greydarker = '#242424'
ossymbol = '#AAAAAA' # dimmed white
user = 'green'
userroot = 'red'
sshsymbol = 'green'
hostname = 'green'
sudo = 'red'
directory = 'cyan'
golang = 'yellow' # TODO
php = '#7a86b8' # light blue
python = 'yellow'
mise = 'yellow'
# git start ---
orangegit = '#E04D27'
conflicted = 'red'
ahead = 'yellow'
behind = 'yellow'
diverged = 'yellow'
uptodate = 'green'
untracked = 'red'
stashed = '#A52A2A' # redbrown
modified = '#C8AC00' # darker yellow
staged = 'green'
renamed = 'yellow'
deleted = 'orange'
# git end ---
jobs = 'blue'
memory = 'purple'
duration = 'yellow'
fill = '#424242' # greydimmed
status = 'red'
shell = '#424242' # greydimmed


[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vicmd_symbol = "[❮](bold green)"
vimcmd_replace_one_symbol = "[❮](bold purple)"
vimcmd_replace_symbol = "[❮](bold purple)"
vimcmd_visual_symbol = "[❮](bold yellow)"

[cmd_duration]
format = "[  $duration]($style)"
style = 'fg:duration'
min_time = 500
disabled = false

# [custom.ssh_no_keys]
# description = "SSH missing keys"
# when = "ssh-add -l | grep -q 'no identities'"
# format = "$symbol[$output]($style) "
# shell = ["dash"]
# symbol = "🔑🚫"
# style = "bold fg:red"
#
